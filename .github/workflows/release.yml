name: Release game

on:
  workflow_dispatch:
    inputs:
      retry_tag:
        description: Existing incomplete release tag to finish without another version bump
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: game-version-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_WORK: ${{ github.workspace }}/.release-work
      RETRY_TAG: ${{ inputs.retry_tag }}
    steps:
      - name: Check out authoritative main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Prepare the checked-in version or resume an incomplete tag
        id: plan
        run: node stealth-steel/tools/release/release-cli.mjs prepare

      - name: Install locked dependencies
        run: npm ci

      - name: Verify publishing contracts
        run: npm run test:publish

      - name: Run full test suite
        run: npm test

      - name: Typecheck the BIS host contract
        run: npm run typecheck:bis-contract

      - name: Build versioned production game
        env:
          GAME_RELEASE_TAG: ${{ steps.plan.outputs.tag }}
        run: npm run build

      - name: Finalize exact metadata and deterministic browser asset
        id: bundle
        env:
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
        run: node stealth-steel/tools/release/release-cli.mjs finalize

      - name: Push verified version commit and tag atomically
        env:
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
          RELEASE_MODE: ${{ steps.plan.outputs.mode }}
          SOURCE_SHA: ${{ steps.plan.outputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_MODE" == "new" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json stealth-steel/public/environment.json
            git commit -m "chore(release): game $RELEASE_TAG"
            git tag "$RELEASE_TAG"
            git fetch origin main --tags
            test "$(git rev-parse refs/remotes/origin/main)" = "$SOURCE_SHA"
            git push --atomic origin "HEAD:refs/heads/main" "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          fi
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"

      - name: Create or verify immutable GitHub Release asset
        env:
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
          RELEASE_ASSET: ${{ steps.bundle.outputs.asset }}
          RELEASE_WORK: ${{ github.workspace }}/.release-work
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json tagName >/dev/null 2>&1; then
            if gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fxq 'stealth-and-steel-web-build.zip'; then
              mkdir -p "$RELEASE_WORK/existing"
              gh release download "$RELEASE_TAG" --pattern 'stealth-and-steel-web-build.zip' --dir "$RELEASE_WORK/existing"
              cmp "$RELEASE_ASSET" "$RELEASE_WORK/existing/stealth-and-steel-web-build.zip"
            else
              gh release upload "$RELEASE_TAG" "$RELEASE_ASSET"
            fi
            if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' | grep -Fxq 'true'; then
              gh release edit "$RELEASE_TAG" --draft=false
            fi
          else
            gh release create "$RELEASE_TAG" "$RELEASE_ASSET" --verify-tag --title "Stealth and Steel $RELEASE_TAG" --notes "Verified browser build for $RELEASE_TAG."
          fi

      - name: Assemble versioned Pages site from release assets
        id: site
        env:
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
        run: node stealth-steel/tools/release/release-cli.mjs stage

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload versioned Pages site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.site.outputs.site }}

      - name: Deploy newest release to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record completed Pages publication
        env:
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
          RELEASE_WORK: ${{ github.workspace }}/.release-work
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json body --jq '.body' > "$RELEASE_WORK/release-notes.md"
          printf '\n<!-- pages-published:%s -->\n' "$RELEASE_TAG" >> "$RELEASE_WORK/release-notes.md"
          gh release edit "$RELEASE_TAG" --notes-file "$RELEASE_WORK/release-notes.md"
