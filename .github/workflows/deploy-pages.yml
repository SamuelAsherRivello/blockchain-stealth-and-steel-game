name: Deploy game Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: game-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify immutable BIS package
        run: node stealth-steel/tools/verify-bis-package.mjs
      - name: Verify publishing contracts
        run: npm run test:publish
      - name: Run full test suite
        run: npm test
      - name: Check real BIS contracts
        run: npm run typecheck:bis-contract
      - name: Build stable game and exact release metadata
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy stable game
        id: deployment
        uses: actions/deploy-pages@v4
