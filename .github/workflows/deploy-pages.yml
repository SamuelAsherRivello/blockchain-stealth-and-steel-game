name: Deploy game Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: game-pages
  cancel-in-progress: false

jobs:
  deploy:
    env:
      VITE_BIS_SERVER_URL: https://bis-server-rho.vercel.app/api/bis/
      GH_TOKEN: ${{ github.token }}
      RELEASE_WORK: ${{ github.workspace }}/.release-pages-work
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify immutable BIS package
        run: node stealth-steel/tools/verify-bis-package.mjs
      - name: Verify publishing contracts
        run: npm run test:publish
      - name: Run full test suite
        run: npm test
      - name: Check real BIS contracts
        run: npm run typecheck:bis-contract
      - name: Build stable game and exact release metadata
        run: npm run build
      - name: Restore immutable release routes into stable Pages site
        shell: bash
        run: |
          set -euo pipefail
          release_tag="v$(node -p "require('./package.json').version")"
          mkdir -p "$RELEASE_WORK"
          gh release download "$release_tag" --pattern 'stealth-and-steel-web-build.zip' --dir "$RELEASE_WORK"
          RELEASE_TAG="$release_tag" node stealth-steel/tools/release/release-cli.mjs stage
          cp -a "$RELEASE_WORK/site/releases" dist/releases
          cp -a "$RELEASE_WORK/site/latest" dist/latest
          cp "$RELEASE_WORK/site/.nojekyll" dist/.nojekyll
          test -f "dist/releases/$release_tag/environment.json"
          test -f dist/latest/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy stable game
        id: deployment
        uses: actions/deploy-pages@v4
